# Install the plugin first, so it is accessible as a packaged JAR.
invoker.goals.0 = clean
invoker.goals.1 = install --projects source-dependency --also-make
invoker.goals.2 = install --projects consumer-parent
invoker.goals.3 = package --projects ./consumer-parent/consumer-includes
invoker.goals.4 = package --projects ./consumer-parent/consumer-excludes
invoker.goals.5 = package --projects ./consumer-parent/consumer-excludes-includes
