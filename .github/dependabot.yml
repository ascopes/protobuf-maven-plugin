version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 999
    schedule:
      interval: weekly
      timezone: Europe/London
    target-branch: main
    assignees:
      - ascopes
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directories:
      - /
      - /protobuf-maven-plugin/src/it/setup
    schedule:
      interval: weekly
      timezone: Europe/London
    open-pull-requests-limit: 999
    target-branch: main
    assignees:
      - ascopes
    labels:
      - dependencies
    groups:
      maven:
        patterns:
          - "*"
        exclude-patterns:
          # Excluded from grouping to generate individual PRs:
          # Error Prone and NullAway versions must be kept in lockstep.
          - "com.google.errorprone:*"
          - "com.uber.nullaway:*"
    ignore:
      # Maven versions should be kept in lockstep with the version
      # of Maven that is in use.
      - dependency-name: 'org.apache.maven.resolver:maven-resolver-api'
        versions:
          - '>=2.0.0'
      - dependency-name: 'org.apache.maven:maven-core'
        versions:
          - '>=4.0.0'
      - dependency-name: 'org.apache.maven:maven-plugin-api'
        versions:
          - '>=4.0.0'
      - dependency-name: 'org.apache.maven.plugin-tools:maven-plugin-annotations'
        versions:
          - '>=4.0.0'
